<!doctype html>
<html lang="es-CR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¡Gracias! · Mundo Online Costa Rica</title><meta name="robots" content="noindex">
<meta name="theme-color" content="#0D2B45"><link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="thanks">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="panel">
    <img src="assets/logo/logo-symbol-animated.svg" alt="Mundo Online">
    <h1 id="t" style="font-size:clamp(2rem,6vw,3.2rem)">¡Gracias por tu compra!</h1>
    <p id="m">Recibimos tu pedido. Te escribiremos pronto para confirmar los detalles y coordinar la entrega.</p>
    <p id="ref" style="font-size:.85rem;opacity:.7;margin-top:-14px"></p>
    <div class="cta-row" style="justify-content:center;margin-top:0"><a class="btn primary" href="./">Volver al inicio</a><a class="btn ghost" data-wa href="#">Escribirnos</a></div>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script>
(() => {
  const C = window.MO_CONFIG, q = new URLSearchParams(location.search), t = document.getElementById('t'), m = document.getElementById('m');
  const num = (C.whatsapp || '').replace(/\D/g, '');
  document.querySelector('[data-wa]').href = num ? `https://wa.me/${num}` : `https://ig.me/m/${C.instagram}`;
  // Tilopay devuelve code=1 cuando el pago fue aprobado
  const failed = q.has('code') && q.get('code') !== '1';
  if (failed) { t.textContent = 'El pago no se completó'; m.textContent = (q.get('description') || 'La transacción fue rechazada.') + ' Puedes intentar de nuevo o escribirnos para ayudarte.'; }
  else if (q.get('pago') === 'whatsapp') { t.textContent = '¡Casi listo!'; m.textContent = 'Envía el mensaje de tu pedido por WhatsApp y coordinamos el pago por SINPE Móvil y la entrega.'; }
  const ref = q.get('ref') || q.get('order') || q.get('orderNumber'); if (ref && !failed) document.getElementById('ref').textContent = 'Referencia: ' + ref;
  if (failed || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // Confeti de marca
  const cv = document.getElementById('fx'), cx = cv.getContext('2d'), cols = ['#14B8A6', '#FF6B4A', '#ffffff', '#F6F6F6'];
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, v: 2 + Math.random() * 4, s: Math.random() * 2 - 1, r: Math.random() * 6, c: cols[Math.random() * 4 | 0] }));
  let f = 0; (function d() { cx.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.y += p.v; p.x += p.s * 2; p.r += .08; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }); if (++f < 420) requestAnimationFrame(d); })();
})();
</script>
</body>
</html>
